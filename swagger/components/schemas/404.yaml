  type: object
  required:
    - status
    - message
    - data
  properties:
    status:
      type: integer
      example: 404
    message:
      description: Message about request
      type: string
      example: Student not found
    data:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'Student not found'