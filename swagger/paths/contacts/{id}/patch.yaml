tags:
  - Contacts
summary: update cotact
operationId: updateContact
description: 'update contact'
security:
  - bearerAuth: [ ]
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: John Doe
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: +380000000006
          email:
            description: "Contact's email"
            type: string
            example: andriy7@example.com
          isFavourite:
            description: "is contact in favourite"
            type: boolean
            example: true
            default: false
          contactType:
            description: "Type of contact"
            type: string
            enum: [ 'work', 'home', 'personal' ]
            default: 'personal'
          photo:
            description: "Photo file"
            type: string
            format: binary
responses:
  '200':
    description: 'created contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
            - createdAt
            - updatedAt
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a student!'
            data:
              type: object
              _id:
                description: "Contact's id"
                type: string
                example: 65e4decdd286b30065d54af9
              allOf:
                - $ref: '../../../components/schemas/contact.yaml'
                - type: object
                  properties:
                    name:
                      example: "Ema Lawrence"
                    createdAt:
                      description: "Date when contact created"
                      type: string
                      example: 2024-05-08T16:12:14.954187
                    updatedAt:
                      description: "Date when contact updated"
                      type: string
                      example: 2024-05-08T16:12:14.954189
  '401':
    description: 'Unauthorized'
    content:
      application/json:
        properties:
          data:
            type: object
            $ref: "../../../components/401.yaml"