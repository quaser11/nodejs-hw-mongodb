tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create contact'
security:
  - bearerAuth: [ ]
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: John Doe
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: +380000000006
          email:
            description: "Contact's email"
            type: string
            example: andriy7@example.com
          isFavourite:
            description: "is contact in favourite"
            type: boolean
            example: true
            default: false
          contactType:
            description: "Type of contact"
            type: string
            enum: [ 'work', 'home', 'personal' ]
            default: 'personal'
          photo:
            description: "Photo file"
            type: string
            format: binary
responses:
  '201':
    description: 'created contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
            - createdAt
            - updatedAt
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created contact with id ${id}!'
            data:
              type: object
              _id:
                description: "Contact's id"
                type: string
                example: 65e4decdd286b30065d54af9
              allOf:
                - $ref: '../../components/schemas/contact.yaml'
                - type: object
                  properties:
                    createdAt:
                      description: "Date when contact created"
                      type: string
                      example: 2024-05-08T16:12:14.954187
                    updatedAt:
                      description: "Date when contact updated"
                      type: string
                      example: 2024-05-08T16:12:14.954189
  '401':
    description: 'Unauthorized'
    content:
      application/json:
          properties:
            data:
              type: object
              $ref: "../../components/401.yaml"